<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revenue Guard — Control Center</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d;
    --text: #c9d1d9; --muted: #8b949e; --accent: #58a6ff;
    --green: #3fb950; --red: #f85149; --amber: #d29922; --purple: #bc8cff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text);
         font-family: -apple-system, 'Segoe UI', sans-serif; padding: 20px; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  h1 .sub { color: var(--muted); font-weight: 400; font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
          gap: 12px; margin: 18px 0; }
  .kpi { background: var(--panel); border: 1px solid var(--border);
         border-radius: 8px; padding: 14px; }
  .kpi .label { color: var(--muted); font-size: 11px; text-transform: uppercase; }
  .kpi .value { font-size: 22px; font-weight: 600; margin-top: 4px; }
  .kpi .value.green { color: var(--green); } .kpi .value.red { color: var(--red); }
  .kpi .value.amber { color: var(--amber); } .kpi .value.accent { color: var(--accent); }
  .panel { background: var(--panel); border: 1px solid var(--border);
           border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  .panel h2 { font-size: 14px; margin-bottom: 10px; color: var(--accent); }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th { text-align: left; color: var(--muted); font-weight: 500;
       padding: 6px 8px; border-bottom: 1px solid var(--border); }
  td { padding: 6px 8px; border-bottom: 1px solid #21262d; }
  tr:hover td { background: #1c2128; cursor: pointer; }
  .badge { padding: 2px 8px; border-radius: 10px; font-size: 10.5px; font-weight: 600; }
  .b-red { background: #3d1e1e; color: var(--red); }
  .b-amber { background: #3d331e; color: var(--amber); }
  .b-green { background: #1e3320; color: var(--green); }
  .b-blue { background: #1c2d45; color: var(--accent); }
  .b-purple { background: #2d1c45; color: var(--purple); }
  .controls { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  input, select, button { background: #0d1117; border: 1px solid var(--border);
    color: var(--text); border-radius: 6px; padding: 7px 10px; font-size: 12.5px; }
  button { cursor: pointer; } button.primary { background: #1f4d78; border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  #detail { display: none; }
  .timeline { list-style: none; }
  .timeline li { display: flex; gap: 10px; padding: 6px 0;
                 border-bottom: 1px solid #21262d; font-size: 12px; }
  .timeline .ts { color: var(--muted); min-width: 150px; }
  .timeline .kind { min-width: 90px; }
  .k-evidence .kind { color: var(--purple); } .k-action .kind { color: var(--amber); }
  .k-verification .kind { color: var(--green); } .k-audit .kind { color: var(--accent); }
  .k-history .kind { color: var(--muted); }
  .bar { height: 6px; border-radius: 3px; background: #21262d; overflow: hidden; margin-top: 6px; }
  .bar > div { height: 100%; background: var(--green); }
  .kv { display: grid; grid-template-columns: 200px 1fr; gap: 4px 12px; font-size: 12.5px; }
  .kv .k { color: var(--muted); }
  .msg { padding: 8px 12px; border-radius: 6px; font-size: 12.5px; margin: 8px 0; }
  .msg.ok { background: #1e3320; color: var(--green); }
  .msg.err { background: #3d1e1e; color: var(--red); }
  .spinner { display: inline-block; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <h1>Revenue Guard — Control Center
    <span class="sub" id="sub">deterministic truth · bounded agent · audited recovery</span></h1>

  <div class="grid" id="kpis"></div>

  <div class="panel" id="list-panel">
    <h2>Recovery Cases</h2>
    <div class="controls">
      <select id="f-status"><option value="">all statuses</option>
        <option>NEW</option><option>INVESTIGATING</option><option>PENDING_APPROVAL</option>
        <option>ESCALATED</option><option>RESOLVED</option></select>
      <select id="f-category"><option value="">all categories</option>
        <option>SETTLEMENT_MISMATCH</option><option>FEE_DISCREPANCY</option>
        <option>REFUND_ECONOMICS</option><option>PAYMENT_MISMATCH</option></select>
      <input id="f-apikey" placeholder="X-API-Key (rg-admin-key)" value="rg-admin-key" style="width:200px">
      <button class="primary" onclick="loadCases()">Refresh</button>
      <button onclick="loadDashboard()">Reload KPIs</button>
    </div>
    <table id="cases"><thead><tr>
      <th>Case</th><th>Order</th><th>Category</th><th>Priority</th>
      <th>Potential ₹</th><th>Status</th><th>Recoverability</th><th></th>
    </tr></thead><tbody></tbody></table>
  </div>

  <div class="panel" id="detail">
    <h2 id="d-title">Case</h2>
    <button onclick="hideDetail()" style="margin-bottom:10px">← back</button>
    <div id="d-msg"></div>
    <div class="kv" id="d-fields"></div>
    <h2 style="margin-top:16px">Actions</h2>
    <div class="controls">
      <button onclick="runPlan()">Plan (LLM only)</button>
      <button class="primary" onclick="runExecute()">Execute full loop</button>
      <button onclick="loadTimeline()">Reload timeline</button>
    </div>
    <h2 style="margin-top:8px">Timeline (audit-chained)</h2>
    <ul class="timeline" id="timeline"></ul>
    <h2 style="margin-top:16px">Evidence</h2>
    <table id="d-evidence"><thead><tr><th>ID</th><th>Kind</th><th>Description</th></tr></thead><tbody></tbody></table>
  </div>

<script>
const API = localStorage.getItem('rg_api_base') || 'http://127.0.0.1:8010';
let currentCase = null;

function key() { return document.getElementById('f-apikey').value || 'rg-admin-key'; }
function headers() { return { 'X-API-Key': key(), 'Content-Type': 'application/json' }; }

const fmt = n => '₹' + Number(n || 0).toLocaleString('en-IN', {maximumFractionDigits: 2});
const badge = (t, cls) => `<span class="badge ${cls}">${t}</span>`;
const catCls = c => c === 'SETTLEMENT_MISMATCH' ? 'b-red' : c === 'FEE_DISCREPANCY' ? 'b-amber' : 'b-purple';

async function api(path, opts) {
  const r = await fetch(API + path, opts ? {...opts, headers: headers()} : {headers: headers()});
  if (!r.ok) throw new Error(`${r.status}: ${(await r.text()).slice(0, 120)}`);
  return r.json();
}

async function loadDashboard() {
  try {
    const d = await api('/api/v1/dashboard/summary');
    const k = d.kpis;
    document.getElementById('sub').textContent =
      `rollout level ${d.rollout_level} · LLM ${d.llm.provider}/${d.llm.model} · ${d.business_now}`;
    const rr = k.recovery_rate || 0;
    document.getElementById('kpis').innerHTML = `
      <div class="kpi"><div class="label">Revenue analysed</div><div class="value">${fmt(k.revenue_analysed)}</div></div>
      <div class="kpi"><div class="label">Leakage detected</div><div class="value red">${fmt(k.leakage_detected)}</div></div>
      <div class="kpi"><div class="label">Recoverable</div><div class="value amber">${fmt(k.recoverable_amount)}</div></div>
      <div class="kpi"><div class="label">Recovered</div><div class="value green">${fmt(k.recovered_amount)}</div></div>
      <div class="kpi"><div class="label">Recovery rate</div><div class="value green">${(rr*100).toFixed(1)}%
        <div class="bar"><div style="width:${Math.min(rr*100,100)}%"></div></div></div></div>
      <div class="kpi"><div class="label">Cases open</div><div class="value accent">${k.cases_open}</div></div>
      <div class="kpi"><div class="label">Agent actions</div><div class="value accent">${k.agent_actions}</div></div>
      <div class="kpi"><div class="label">Failed actions</div><div class="value ${k.failed_actions ? 'red':'green'}">${k.failed_actions}</div></div>
      <div class="kpi"><div class="label">Human escalations</div><div class="value amber">${k.human_escalations}</div></div>`;
  } catch (e) { console.error(e); }
}

async function loadCases() {
  const st = document.getElementById('f-status').value;
  const ct = document.getElementById('f-category').value;
  const q = new URLSearchParams({limit: 100});
  if (st) q.set('status', st); if (ct) q.set('category', ct);
  const d = await api('/api/v1/cases?' + q);
  document.querySelector('#cases tbody').innerHTML = d.cases.map(c => `
    <tr onclick="showDetail('${c.case_id}')">
      <td>${c.case_id}</td><td>${c.order_id}</td>
      <td>${badge(c.category, catCls(c.category))}</td>
      <td>${c.priority}</td>
      <td>${Number(c.potential_leakage).toFixed(2)}</td>
      <td>${badge(c.status, 'b-blue')}</td>
      <td>${badge(c.recoverability_status, 'b-green')}</td>
      <td><button onclick="event.stopPropagation(); quickRun('${c.case_id}')">Run agent</button></td>
    </tr>`).join('');
}

async function showDetail(caseId) {
  currentCase = caseId;
  const c = await api('/api/v1/cases/' + caseId);
  document.getElementById('list-panel').style.display = 'none';
  document.getElementById('detail').style.display = 'block';
  document.getElementById('d-title').textContent = caseId + ' — ' + c.category;
  document.getElementById('d-fields').innerHTML = [
    ['Order', c.order_id], ['Payment', c.payment_id],
    ['Expected settlement', fmt(c.expected_settlement)],
    ['Actual settlement', fmt(c.actual_settlement)],
    ['Potential leakage', fmt(c.potential_leakage)],
    ['Deadline', c.deadline_at], ['Allowed actions', c.allowed_actions.replaceAll('|', ' · ')],
    ['Approval required', c.approval_required],
    ['Recoverability', c.recoverability_status],
  ].map(([k, v]) => `<div class="k">${k}</div><div>${v}</div>`).join('');
  document.querySelector('#d-evidence tbody').innerHTML = (c.evidence || []).map(e =>
    `<tr><td>${e.evidence_id}</td><td>${badge(e.evidence_kind, 'b-purple')}</td>
     <td>${e.description || ''}</td></tr>`).join('');
  await loadTimeline();
}

async function loadTimeline() {
  const t = await api('/api/v1/cases/' + currentCase + '/timeline');
  document.getElementById('timeline').innerHTML = t.events.map(e =>
    `<li class="k-${e.kind}">
       <span class="ts">${(e.ts || '').replace('T', ' ').replace('Z', '')}</span>
       <span class="kind">${e.kind}</span>
       <span><b>${e.event}</b> ${e.actor ? '· ' + e.actor : ''}<br>
       <span style="color:var(--muted)">${e.detail || ''}</span></span>
     </li>`).join('');
}

async function runPlan() {
  const m = document.getElementById('d-msg');
  m.innerHTML = `<div class="msg">LLM planning…</div>`;
  try {
    const r = await api('/api/v1/cases/' + currentCase + '/plan', {method: 'POST'});
    m.innerHTML = `<div class="msg ok">LLM proposes <b>${r.llm_plan.recommended_action}</b>
      (confidence ${(r.llm_plan.diagnosis.confidence*100).toFixed(0)}%):
      ${r.llm_plan.diagnosis.root_cause}</div>`;
  } catch (e) { m.innerHTML = `<div class="msg err">${e.message}</div>`; }
}

async function runExecute() {
  const m = document.getElementById('d-msg');
  m.innerHTML = `<div class="msg"><span class="spinner">◌</span> Running full loop…</div>`;
  try {
    const r = await api('/api/v1/cases/' + currentCase + '/execute', {method: 'POST'});
    m.innerHTML = `<div class="msg ${r.status === 'COMPLETED' ? 'ok' : 'err'}">
      ${r.status} · proposed ${r.proposed_action} → executed ${r.executed_action}
      · verification ${r.verification_status || '—'}
      · recovered ${fmt(r.recovered_amount)} · ${r.duration_ms}ms · ${r.tool_calls} tool calls</div>`;
    await loadTimeline(); loadDashboard();
  } catch (e) { m.innerHTML = `<div class="msg err">${e.message}</div>`; }
}

async function quickRun(caseId) {
  const r = await api('/api/v1/cases/' + caseId + '/execute', {method: 'POST'});
  alert(`${r.status}: ${r.proposed_action} → ${r.executed_action || '—'} | ${r.verification_status || ''} | ${fmt(r.recovered_amount)}`);
  loadDashboard(); loadCases();
}

function hideDetail() {
  document.getElementById('detail').style.display = 'none';
  document.getElementById('list-panel').style.display = 'block';
}

loadDashboard(); loadCases();
</script>
</body>
</html>
